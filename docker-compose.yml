name: knowledge-stack

networks:
  knowledge-stack:
    driver: bridge

volumes:
  redis_data:
  rustfs_data:
  etcd_data:
  milvus_data:
  postgres_data:

services:
  # --- relational store (users, projects, folders, files metadata) ------
  postgres:
    image: postgres:17-alpine
    networks: [knowledge-stack]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_stack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_stack}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_stack}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge_stack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- queue -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    networks: [knowledge-stack]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- file storage (RustFS, shared by Milvus and the app) ---------------
  rustfs:
    container_name: milvus-rustfs
    image: rustfs/rustfs:latest
    networks: [knowledge-stack]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-minioadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: us-east-1
      # RUSTFS_SERVER_DOMAINS: localhost# Optional; not required for local deployments
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - rustfs_data:/data
    command: >
      --address :9000
      --console-enable
      /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # --- vector store (Milvus standalone + its own deps) -------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    networks: [knowledge-stack]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.6.7
    networks: [knowledge-stack]
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: rustfs:9000
      MINIO_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${RUSTFS_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MILVUS_BUCKET_NAME:-milvus-bucket}
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - rustfs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  attu:
    image: zilliz/attu:v2.5.0
    networks: [knowledge-stack]
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3000:3000"
    depends_on:
      milvus:
        condition: service_healthy

  # --- app services --------------------------------------------------
  file-api:
    build:
      context: ./file-api
    networks: [knowledge-stack]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-knowledge_stack}:${POSTGRES_PASSWORD:-knowledge_stack}@postgres:5432/${POSTGRES_DB:-knowledge_stack}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      RUSTFS_URL: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-minioadmin}
      RUSTFS_BUCKET_NAME: ${APP_BUCKET_NAME:-content-bucket}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
    ports:
      - "8000:8000"
    volumes:
      - ./file-api:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  file-worker:
    build:
      context: ./file-worker
    networks: [knowledge-stack]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-knowledge_stack}:${POSTGRES_PASSWORD:-knowledge_stack}@postgres:5432/${POSTGRES_DB:-knowledge_stack}
      MILVUS_URI: http://milvus:19530
      RUSTFS_URL: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-minioadmin}
      RUSTFS_BUCKET_NAME: ${APP_BUCKET_NAME:-content-bucket}
    ports:
      - "8081:8081" # saq web UI
    volumes:
      - ./file-worker:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
