server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Strips the /api/ prefix before forwarding - since backend server
    # does not need or handle that prefix
    location /api/ {
        proxy_pass http://localhost:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend server exposes a static HTML UI for its /monitor - which needs to
    # now route via the frontend since backend server is not publicly exposed
    location /monitor {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback - a request for a client-side route like /xyz has no
    # matching file on disk, so serve index.html and let React Router
    # render it instead of returning a 404.
    location / {
        try_files $uri /index.html;
    }
}
